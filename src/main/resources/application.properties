spring.application.name=SimpleLotery

spring.config.import=optional:file:.env[.properties]

# Placeholders to be filled by .env file
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

springdotenv.ignore-if-missing=true 

# Show SQL in console for debugging
spring.jpa.show-sql=true
# Automatically create/update the DB schema based on your Entities
spring.jpa.hibernate.ddl-auto=update
